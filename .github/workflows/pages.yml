name: Publish Vote Chase page
# Publishes only tools/vote-chase/index.html to GitHub Pages. Activates once the repository's
# Pages source is set to "GitHub Actions" (Settings → Pages). Nothing else in the repo is published.
on:
  push:
    branches: [main]
    paths: ["tools/vote-chase/index.html", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Actions are pinned to full commit SHAs (tags can be repointed); the comment names the version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: mkdir -p site/tools/vote-chase && cp tools/vote-chase/index.html site/tools/vote-chase/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
